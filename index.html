<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Подключение AzauVPN</title>
</head>
<body style="font-family: sans-serif; text-align: center; padding: 40px 16px;">
<p>Открываем Happ…</p>
<p><a id="go" href="#">Если ничего не произошло — нажмите здесь</a></p>
<script>
  var link = decodeURIComponent(location.hash.slice(1));
  if (link.indexOf("happ://") === 0) {
    document.getElementById("go").href = link;
    location.replace(link);
  }
</script>
</body>
</html>
